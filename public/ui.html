<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau AI Insight</title>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Tableau Extensions JS SDK -->
  <script src="js/tableau.extensions.1.latest.js"></script>
  
  <!-- Marked.js for rendering markdown output -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="pure-text-container" id="appContainer">
    
    <!-- Skeleton Loading State (Minimalist shimmer) -->
    <div id="loadingView" class="loading-state hidden">
      <div class="shimmer-line line-title"></div>
      <div class="shimmer-line line-full"></div>
      <div class="shimmer-line line-three-quarters"></div>
      <div class="loading-subtle-hint">
        <span class="spinner-dot"></span>
        <span>Menyusun insight data...</span>
      </div>
    </div>

    <!-- Pure Insight Text Area -->
    <div id="insightView" class="insight-view-text">
      <p class="placeholder-text">Menghubungkan ke Tableau...</p>
    </div>

    <!-- Error Message Display -->
    <div id="errorView" class="error-view-inline hidden">
      <p id="errorMessage" class="error-inline-msg">Gagal memuat insight.</p>
    </div>

  </div>

  <!-- Main Logic -->
  <script src="js/app.js"></script>
</body>
</html>
